[package]
name = "cosmic-ext-applet-cheatsheet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A COSMIC panel applet: a searchable keyboard-shortcut cheat sheet with user-defined custom shortcuts"

[dependencies]
env_logger = "0.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.libcosmic]
# Pinned to the libcosmic revision matching the installed cosmic-comp
# (built 2026-07-09). Master is newer and mismatches this compositor's
# corner-radius protocol (crash on resume) and theme schema (list_button).
git = "https://github.com/pop-os/libcosmic"
rev = "c44dbe7"
default-features = false
features = ["applet-token"]
