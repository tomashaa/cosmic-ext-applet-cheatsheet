[package]
name = "cosmic-ext-applet-cheatsheet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A COSMIC panel applet: a searchable keyboard-shortcut cheat sheet with user-defined custom shortcuts"
repository = "https://github.com/tomashaa/cosmic-ext-applet-cheatsheet"
readme = "README.md"

[dependencies]
env_logger = "0.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
shlex = "1"
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon" }
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"
rust-embed = "8"
unic-langid = "0.9"

[dependencies.libcosmic]
# Track upstream libcosmic. The exact rev is pinned in Cargo.lock for
# reproducible builds; corner-radius is disabled in code to stay robust
# across compositor protocol versions.
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet-token"]
